name: Build MeetConnect Android Apps

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/android-all-apps.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: customer
            app_id: com.meetconnect.app
            app_name: MeetConnect
            app_url: https://meetconnect-woad.vercel.app
          - app: employee
            app_id: com.meetconnect.employee
            app_name: MeetConnect Employee
            app_url: https://meetconnect-employee.vercel.app
          - app: admin
            app_id: com.meetconnect.admin
            app_name: MeetConnect Admin
            app_url: https://meetconnect-admin.vercel.app
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install Capacitor
        run: npm install @capacitor/core@^7.4.3 @capacitor/android@^7.4.3 @capacitor/cli@^7.4.3
      - name: Create app wrapper configuration
        env:
          APP_ID: ${{ matrix.app_id }}
          APP_NAME: ${{ matrix.app_name }}
          APP_URL: ${{ matrix.app_url }}
        run: |
          mkdir -p dist
          printf '<!doctype html><html><head><meta name="viewport" content="width=device-width, initial-scale=1"></head><body></body></html>' > dist/index.html
          cat > capacitor.config.json <<EOF
          {
            "appId": "${APP_ID}",
            "appName": "${APP_NAME}",
            "webDir": "dist",
            "server": {
              "url": "${APP_URL}",
              "cleartext": false
            },
            "android": {
              "allowMixedContent": false
            }
          }
          EOF
      - name: Generate and sync Android project
        run: |
          npx cap add android
          npx cap sync android
      - name: Build installable debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MeetConnect-${{ matrix.app }}-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
